name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff black pytest pandera prometheus-client shap dvc
        pip install -e .

    - name: Code Quality (Linting)
      run: |
        black --check .
        ruff check .

    - name: Run Tests
      run: |
        python -m pytest tests/unit

    - name: Build API image
      run: docker build -f Dockerfile.api -t fraud-api:test .
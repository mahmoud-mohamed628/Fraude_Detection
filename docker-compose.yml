version: '3.8'

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.2
    ports:
      - "5000:5000"
    command: >-
      mlflow server --host 0.0.0.0
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow

  api:
    build: 
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - ./src:/app/src:z
    depends_on:
      mlflow:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --mode dev-container
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "9092:9092"
      - "19092:19092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -qE 'Healthy:[[:space:]]+true'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s

  producer:
    build:
      context: .
      dockerfile: Dockerfile.streaming
    command: ["python", "-m", "src.fraud.streaming.producer"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      PRODUCER_SPEED: "5"
      FRAUD_INJECTION_RATE: "0.05"
      FRAUD_BURST_EVERY: "100"
    volumes:
      - ./data:/app/data:ro
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  consumer:
    build:
      context: .
      dockerfile: Dockerfile.streaming
    command: ["python", "-m", "src.fraud.streaming.consumer"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      FRAUD_API_URL: http://api:8000/predict
      FRAUD_DB: /app/data/fraud.db
    volumes:
      - fraud_data:/app/data
      - ./src:/app/src:ro
    depends_on:
      redpanda:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "8501:8501"
    environment:
      FRAUD_DB: /app/data/fraud.db
      FRAUD_API_URL: http://api:8000
    volumes:
      - fraud_data:/app/data:ro
    depends_on:
      consumer:
        condition: service_started

volumes:
  mlflow_data:
  fraud_data: